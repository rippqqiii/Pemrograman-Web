<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gramedia | Buat Transaksi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="../index.html">Gramedia</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Produk</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="../produk/list.html">Daftar Buku</a></li>
                            <li><a class="dropdown-item" href="../produk/tambah.html">Tambah Buku</a></li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Penjualan</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="list.html">Riwayat Penjualan</a></li>
                            <li><a class="dropdown-item active" href="tambah.html">Buat Transaksi</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section>
            <h2>Buat Transaksi</h2>
            <form id="form-tambah" style="max-width: 500px; margin: 0 auto;">
                <p>
                    <label for="id_transaksi">ID Transaksi</label><br>
                    <input type="text" id="id_transaksi" name="id_transaksi" readonly placeholder="Auto-generated">
                </p>
                <p>
                    <label for="tanggal">Tanggal</label><br>
                    <input type="date" id="tanggal" name="tanggal" required>
                </p>
                <p>
                    <label for="buku">Buku</label><br>
                    <select id="buku" name="buku" required>
                        <option value="">Pilih Buku</option>
                        <option value="Laskar Pelangi">Laskar Pelangi</option>
                        <option value="Bumi Manusia">Bumi Manusia</option>
                        <option value="Negeri 5 Menara">Negeri 5 Menara</option>
                    </select>
                </p>
                <p>
                    <label for="jumlah">Jumlah</label><br>
                    <input type="number" id="jumlah" name="jumlah" min="1" required>
                </p>
                <p>
                    <label for="total">Total Harga</label><br>
                    <input type="number" id="total" name="total" required>
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistem Penjualan Buku &mdash; Ahmad Rifqi (254107060131)</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
