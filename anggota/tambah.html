<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-Mini | Tambah Anggota</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../buku/list.html">Daftar Buku</a></li>
                <li><a href="../buku/tambah.html">Tambah Buku</a></li>
                <li><a href="list.html">Daftar Anggota</a></li>
                <li><a href="tambah.html" class="active">Tambah Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Form Tambah Anggota Baru</h2>
            <form action="list.html" method="get">
                <p>
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama" placeholder="Contoh: Budi Santoso" required>
                </p>
                <p>
                    <label for="no_anggota">Nomor Anggota</label>
                    <input type="text" id="no_anggota" name="no_anggota" placeholder="Contoh: A004" required>
                </p>
                <p>
                    <label for="alamat">Alamat Domisili</label>
                    <input type="text" id="alamat" name="alamat" placeholder="Contoh: Jl. Soekarno Hatta No. 9, Malang">
                </p>
                <p>
                    <label for="no_hp">Nomor HP / WhatsApp</label>
                    <input type="tel" id="no_hp" name="no_hp" placeholder="Contoh: 081234567890">
                </p>
                <p>
                    <button type="submit">Simpan Data Anggota</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Pemrograman Web</p>
    </footer>
</body>
</html>
